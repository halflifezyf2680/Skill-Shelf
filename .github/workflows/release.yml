name: Build Release Assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: skill-shelf.exe
            archive_ext: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: skill-shelf.exe
            archive_ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: skill-shelf
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: skill-shelf
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            binary: skill-shelf
            archive_ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary: skill-shelf
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Rust binary
        run: cargo build --release --locked --manifest-path rust/skill-shelf/Cargo.toml --target ${{ matrix.target }}

      - name: Package runtime directory
        run: >
          node scripts/package-release.mjs
          --target ${{ matrix.target }}
          --binary rust/skill-shelf/target/${{ matrix.target }}/release/${{ matrix.binary }}
          --archive-ext ${{ matrix.archive_ext }}
          --out-dir dist/release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-shelf-${{ matrix.target }}
          path: dist/release/skill-shelf-v*-*.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist/artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/artifacts/*
